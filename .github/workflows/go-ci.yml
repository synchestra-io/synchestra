name: Go CI

on:
  push:
    paths:
      - '.github/workflows/go-ci.yml'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - '.github/workflows/go-ci.yml'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  strongo_workflow:
    permissions:
      contents: write
    uses: strongo/cicd/.github/workflows/workflow.yml@v1

    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
    with:
      # Version bump + release now happen in release.yml (continuous delivery on
      # push to main). Disable bumping here so CI does not cut a competing tag.
      disable-version-bumping: true
#      code_coverage: true
#      min_test_coverage_percent: 100
