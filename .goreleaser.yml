version: 2

project_name: synchestra

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: synchestra
    main: .
    binary: synchestra
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Exclude windows/arm64 — not yet a common target
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/strongo/buildinfo.version={{.Version}}
      - -X github.com/strongo/buildinfo.commit={{.FullCommit}}
      - -X github.com/strongo/buildinfo.date={{.Date}}

archives:
  - id: synchestra
    ids:
      - synchestra
    name_template: "synchestra_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    formats: [tar.gz]

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

release:
  disable: true

changelog:
  disable: true
